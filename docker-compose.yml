services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hypothesis-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      llm-service:
        condition: service_healthy
      content-extraction:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: llm-service
    ports:
      - "${LLM_PORT:-8000}:8000"
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  data-processor:
    build:
      context: ./data-processor
      dockerfile: Dockerfile
      args:
        INSTALL_JAVA: "${DP_JAVA:-true}"
    container_name: data-processor
    ports:
      - "${DP_PORT:-8001}:8001"
    env_file:
      - ./data-processor/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - IMAGES_DIR=/app/images
      - UPLOADS_DIR=/app/uploads
      - OUTPUT_DIR=/app/output
      - PDF_HYBRID_URL=${DP_HYBRID_URL:-http://localhost:5002}
    volumes:
      - images_data:/app/images
      - output_data:/app/output
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "1G"

  manual-analysis:
    build:
      context: ./manual-analysis
      dockerfile: Dockerfile
    container_name: manual-analysis
    ports:
      - "${MANUAL_ANALYSIS_PORT:-8002}:8002"
    env_file:
      - ./manual-analysis/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - LLM_SERVICE_URL=http://llm-service:8000/api/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  content-extraction:
    build:
      context: ./content-extraction
      dockerfile: Dockerfile
    container_name: content-extraction
    ports:
      - "${EXTRACT_PORT:-8005}:8005"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hypothesis-rabbitmq
    ports:
      - "5672:5672"
      - "${RMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hypothesis
      RABBITMQ_DEFAULT_PASS: hypothesis2026
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: hypothesis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26-community
    container_name: hypothesis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/hypothesis2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: "1G"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  graphrag-worker:
    build:
      context: ./graphrag-service
      dockerfile: Dockerfile
    container_name: graphrag-worker
    environment:
      RABBITMQ_URL: amqp://hypothesis:hypothesis2026@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      VECTOR_BACKEND: qdrant
      GRAPH_BACKEND: networkx
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  images_data:
  output_data:
  rabbitmq_data:
  qdrant_data:
  neo4j_data:
