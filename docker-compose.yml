services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hypothesis-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      llm-service:
        condition: service_healthy
      content-extraction:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: llm-service
    ports:
      - "${LLM_PORT:-8000}:8000"
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  manual-analysis:
    build:
      context: ./manual-analysis
      dockerfile: Dockerfile
    container_name: manual-analysis
    ports:
      - "${MANUAL_ANALYSIS_PORT:-8002}:8002"
    env_file:
      - ./manual-analysis/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - LLM_SERVICE_URL=http://llm-service:8000/api/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  content-extraction:
    build:
      context: ./content-extraction
      dockerfile: Dockerfile
    container_name: content-extraction
    ports:
      - "${EXTRACT_PORT:-8005}:8005"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
