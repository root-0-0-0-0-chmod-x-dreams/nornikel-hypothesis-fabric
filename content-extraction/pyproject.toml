[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-extraction"
version = "0.1.0"
description = "FastAPI microservice that renders pages, extracts article content, and returns Markdown JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "playwright>=1.45",
  "readability-lxml>=0.8.1",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.poetry]
package-mode = false