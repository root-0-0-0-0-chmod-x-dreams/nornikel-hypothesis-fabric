services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hypothesis-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hypothesis
      RABBITMQ_DEFAULT_PASS: hypothesis2026
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: hypothesis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: hypothesis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/hypothesis2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data

  graphrag-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-worker
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://hypothesis:hypothesis2026@rabbitmq:5672/
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      VECTOR_BACKEND: qdrant
      GRAPH_BACKEND: networkx
    depends_on:
      - rabbitmq
      - qdrant
    restart: unless-stopped

volumes:
  rabbitmq_data:
  neo4j_data:
  qdrant_data:
