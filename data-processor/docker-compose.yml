services:
  data-processor:
    build: .
    container_name: data-processor
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - IMAGES_DIR=/app/images
      - UPLOADS_DIR=/app/uploads
      - OUTPUT_DIR=/app/output
      - PDF_LIBRARY=${PDF_LIBRARY:-opendataloader}
      - PDF_IMAGE_OUTPUT=${PDF_IMAGE_OUTPUT:-external}
      - PDF_IMAGE_FORMAT=${PDF_IMAGE_FORMAT:-jpeg}
      - PDF_HYBRID_ENABLED=${PDF_HYBRID_ENABLED:-false}
      - PDF_HYBRID_BACKEND=${PDF_HYBRID_BACKEND:-docling-fast}
      - PDF_HYBRID_URL=${PDF_HYBRID_URL:-http://hybrid-server:5002}
      - PDF_HYBRID_MODE=${PDF_HYBRID_MODE:-auto}
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-ru,en}
      - OCR_GPU_ENABLED=${OCR_GPU_ENABLED:-false}
    volumes:
      - images_data:/app/images
      - output_data:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "1G"

  hybrid-server:
    profiles: ["hybrid"]
    image: python:3.12-slim
    container_name: hybrid-server
    command: >
      sh -c "
        pip install 'opendataloader-pdf[hybrid]' &&
        opendataloader-pdf-hybrid --host 0.0.0.0 --port 5002 --force-ocr --ocr-lang ${OCR_LANGUAGES:-ru,en}
      "
    ports:
      - "5002:5002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"

volumes:
  images_data:
  output_data:
